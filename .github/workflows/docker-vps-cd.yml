name: Deploy Docker Compose

on:
  push:
    branches: ["production"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Nếu secrets nằm trong Environment production, bỏ comment:
    # environment: production

    steps:
      - name: Tạo env và deploy trên VPS
        uses: appleboy/ssh-action@master
        env:
          DEPENDENCIES_ENV: ${{ secrets.DEPENDENCIES_ENV }}
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          FILE_SERVICES_ENV: ${{ secrets.FILE_SERVICES_ENV }}
          EMAIL_SERVICES_ENV: ${{ secrets.EMAIL_SERVICES_ENV }}
          NOTIFIER_SERVICES_ENV: ${{ secrets.NOTIFIER_SERVICES_ENV }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: DEPENDENCIES_ENV,BACKEND_ENV,FILE_SERVICES_ENV,EMAIL_SERVICES_ENV,NOTIFIER_SERVICES_ENV
          script: |
            set -eu
            cd "$HOME/services/toboco"

            git fetch origin production
            git checkout production
            git merge --ff-only origin/production

            : "${DEPENDENCIES_ENV:?Missing DEPENDENCIES_ENV}"
            : "${BACKEND_ENV:?Missing BACKEND_ENV}"
            : "${FILE_SERVICES_ENV:?Missing FILE_SERVICES_ENV}"
            : "${EMAIL_SERVICES_ENV:?Missing EMAIL_SERVICES_ENV}"
            : "${NOTIFIER_SERVICES_ENV:?Missing NOTIFIER_SERVICES_ENV}"

            test -d backend
            test -d file-services
            test -d email-services
            test -d notifier-services

            umask 077
            printf '%s' "$DEPENDENCIES_ENV" > .env.dependencies
            printf '%s' "$BACKEND_ENV" > backend/.env
            printf '%s' "$FILE_SERVICES_ENV" > file-services/.env
            printf '%s' "$EMAIL_SERVICES_ENV" > email-services/.env
            printf '%s' "$NOTIFIER_SERVICES_ENV" > notifier-services/.env

            chmod 600 \
              .env.dependencies \
              backend/.env \
              file-services/.env \
              email-services/.env \
              notifier-services/.env

            echo "Start services"
            docker compose up -d --build
            docker compose ps