name: Deploy Docker Compose

on:
  push:
    branches: ["production"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          command_timeout: 30m
          script: |
            set -eu
            cd "$HOME/services/task-management"
            git fetch origin production
            git checkout production
            git merge --ff-only origin/production
            echo "Validate Compose configuration"
            docker compose config --quiet
            echo "Check MongoDB"
            docker compose run --rm --no-deps check-mongo

            echo "Check Redis"
            docker compose run --rm --no-deps check-redis

            echo "Check RabbitMQ"
            docker compose run --rm --no-deps check-rabbitmq

            echo "Build application images"
            docker compose build \
              file-services \
              email-services \
              notifier-services

            echo "Start services"
            docker compose up -d --no-build

            docker compose ps