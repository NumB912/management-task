name: Node.js Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]  

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x,18.x]

    steps:
      - uses: actions/checkout@v4
      - name: use nodejs at version ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix }}
          cache: 'npm'
      - run: npm ci
      - run: npm test
  

