x-check-common: &check-common
  env_file:
    - ./.env.dependencies
  restart: "no"
  networks:
    - tm-network

x-dependencies:
  check-mongo:
    condition: service_completed_successfully
  check-redis:
    condition: service_completed_successfully
  check-rabbitmq:
    condition: service_completed_successfully
services:
  back-end:
    build: "./backend"
    container_name: toboco-backend
    env_file: ./backend/.env
    ports:
      - "3010:3010"
    depends_on:
      check-mongo:
        condition: service_completed_successfully
      check-redis:
        condition: service_completed_successfully
      check-rabbitmq:
        condition: service_completed_successfully

  front-end:
    build: "./frontend"
    env_file: "./frontend/.env.local"
    container_name: toboco-frontend
    ports:
     - "3000:3000"
    depends_on:
     - back-end
        
  file-services:
    build: "./file-services"
    container_name: toboco-file-services
    ports:
      - "3006:3006"
    env_file: ./file-services/.env
    depends_on: 
      check-rabbitmq:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - tm-network
  email-services:
    build: "./email-services"
    container_name: toboco-email-services
    ports:
      - "3001:3001"
    env_file: ./email-services/.env
    depends_on: 
      check-rabbitmq:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - tm-network
  notifier-services:
    build: "./notifier-services"
    container_name: toboco-notifier-services
    ports:
      - "3005:3005"
    env_file: ./notifier-services/.env
    depends_on: 
      check-rabbitmq:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - tm-network

  check-mongo:
    <<: *check-common
    image: mongo:7
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        : "$${MONGODB_URI:?Missing MONGODB_URI}"
        timeout 40 mongosh "$$MONGODB_URI" --quiet \
          --eval '
        const result = db.runCommand({ ping: 1 });
        if (result.ok !== 1) {
          print("MongoDB: ERROR");
          quit(1);
        }
        print("MongoDB: OK");
        '  
  check-redis:
    <<: *check-common
    image: redis:7-alpine
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        : "$${REDIS_URI:?Missing REDIS_URI}"
        result="$$(timeout 15 redis-cli -u "$$REDIS_URI" PING)"
        if [ "$$result" != "PONG" ]; then
          echo "Redis: FAIL"
          exit 1
        fi
        echo "Redis: OK"
        
  check-rabbitmq:
    <<: *check-common
    image: alpine:3.21
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        : "$${RABBITMQ_HOST:?Missing RABBITMQ_HOST}"
        : "$${RABBITMQ_PORT:?Missing RABBITMQ_PORT}"
        echo >> "$${RABBITMQ_PORT:?Missing RABBITMQ_PORT}"
        nc -z -v -w 10 "$$RABBITMQ_HOST" "$$RABBITMQ_PORT"
        echo "RabbitMQ TCP: OK"
networks:
  tm-network:
    driver: bridge