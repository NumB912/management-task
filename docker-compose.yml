x-check-common: &check-common
  env_file:
    - ./.env.dependencies
  restart: "no"
  networks:
    - tm-network

x-dependencies: &dependencies
  check-mongo:
    condition: service_completed_successfully
  check-redis:
    condition: service_completed_successfully
  check-rabbitmq:
    condition: service_completed_successfully

services:
  file-services:
    build: "./file-services"
    container_name: task-management-file-services
    ports:
      - "3006:3006"
    env_file: ./file-services/.env
    depends_on: *dependencies
    restart: on-failure
    networks:
      - tm-network

  email-services:
    build: "./email-services"
    container_name: task-management-email-services
    ports:
      - "3001:3001"
    env_file: ./email-services/.env
    depends_on: *dependencies
    restart: on-failure
    networks:
      - tm-network

  notifier-services:
    build: "./notifier-services"
    container_name: task-management-notifier-services
    ports:
      - "3005:3005"
    env_file: ./notifier-services/.env
    depends_on: *dependencies
    restart: on-failure
    networks:
      - tm-network

  check-mongo:
    <<: *check-common
    image: mongo:7
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        : "$${MONGODB_URI:?Missing MONGODB_URI}"
        timeout 20 mongosh "$$MONGODB_URI" --quiet \
          --eval '
            const result = db.runCommand({ ping: 1 });
            if (result.ok !== 1) quit(1);
            print("MongoDB: OK");
          '

  check-redis:
    <<: *check-common
    image: redis:7-alpine
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        : "$${REDIS_URI:?Missing REDIS_URI}"
        result="$$(timeout 15 redis-cli -u "$$REDIS_URI" PING)"
        if [ "$$result" != "PONG" ]; then
          echo "Redis: FAIL"
          exit 1
        fi
        echo "Redis: OK"

  check-rabbitmq:
    <<: *check-common
    image: python:3.12-alpine
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        : "$${RABBITMQ_URI:?Missing RABBITMQ_URI}"
        pip install --quiet --no-cache-dir \
          --disable-pip-version-check \
          --timeout 15 --retries 2 pika==1.3.2

        timeout 20 python - <<'PY'
        import os
        import sys
        import pika

        try:
            params = pika.URLParameters(os.environ["RABBITMQ_URI"])
            params.connection_attempts = 1
            params.socket_timeout = 10
            params.stack_timeout = 15

            connection = pika.BlockingConnection(params)
            try:
                channel = connection.channel()
                channel.close()
            finally:
                connection.close()

            print("RabbitMQ: OK")
        except Exception as error:
            print(
                f"RabbitMQ: FAIL ({type(error).__name__})",
                file=sys.stderr,
            )
            sys.exit(1)
        PY
Ư
networks:
  tm-network:
    driver: bridge