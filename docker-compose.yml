services:
  email-services:
    build: "./email-services"
    container_name: task-management-email-services
    ports:
      - "3001:3001"
    env_file: ./email-services/.env
    depends_on:
      mailhog: 
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - tm-network
  notifier-services:
    build: "./notifier-services"
    container_name: task-management-notifier-services
    ports:
      - "3005:3005"
    env_file: ./notifier-services/.env
    depends_on:
      mailhog: 
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - tm-network
